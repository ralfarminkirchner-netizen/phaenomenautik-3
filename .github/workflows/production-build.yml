name: Production build

# Validate the full TypeScript/Vite build before another change reaches production.
# This workflow checks builds and serving only; it never deploys to Railway.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Check the declared minimum as well as current Node 22 and 24 releases.
        node: ['22.12.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # GitHub's clean workspace has no Railpack node_modules cache mount.
      # npm ci verifies that the committed lockfile remains installable.
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check graph data and progress rules
        run: node qa/graph.cjs
      - name: Check production server and asset responses
        run: node --test qa/server.test.mjs
